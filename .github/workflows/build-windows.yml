name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ambil source ke folder aman
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'bagi-layar-source.zip'
          $dst = Join-Path $env:RUNNER_TEMP 'bagi-layar-source'
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $src = Get-ChildItem $dst -Directory | Select-Object -First 1
          "APP_SOURCE=$($src.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Instal dependency build
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: python -m pip install -r "$env:APP_SOURCE\requirements.txt" pyinstaller

      - name: Validasi source dan UI
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location $env:APP_SOURCE
          python -m compileall -q app main.py
          python -c "from app.main_window import MainWindow; from app.widgets import MonitorPreview, WindowListWidget; print('Base UI imports OK')"
          python -c "from PySide6.QtWidgets import QApplication; from app.zone_overlay import ZoneOverlay; app=QApplication([]); overlay=ZoneOverlay(); overlay.close(); print('Zone overlay OK')"
          python -c "from app.multi_monitor import MultiMonitorMainWindow, MultiMonitorDragZoneController; p=MultiMonitorMainWindow._normalize_profile({'layout_count':4,'margin':9,'gap':7}); assert p['layout_count']==4 and p['margin']==9 and p['gap']==7; print('Multi-monitor profile OK')"
          python -c "from PySide6.QtWidgets import QApplication; from app.multi_monitor import MultiMonitorMainWindow; app=QApplication([]); win=MultiMonitorMainWindow(); assert len(win._targets()) >= 1; win.close(); print('Multi-monitor window OK')"
          python -c "from PySide6.QtWidgets import QApplication; from app.multi_monitor import MultiMonitorMainWindow; from app.tray import TrayController; app=QApplication([]); win=MultiMonitorMainWindow(); tray=TrayController(app,win,None,None); assert tray.open_action.text()=='Buka Bagi Layar'; assert tray.startup_action.text()=='Mulai bersama Windows'; tray.close(); win.close(); print('System tray controller OK')"
          python -c "from app.startup import startup_command; cmd=startup_command(); assert '--tray' in cmd; print('Portable auto-start command OK:', cmd)"

      - name: Tes engine layout
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-Location $env:APP_SOURCE
          python -m unittest discover -s tests -v

      - name: Build portable folder
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-Location $env:APP_SOURCE
          pyinstaller --noconfirm --clean --windowed --name "Bagi-Layar" main.py

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Bagi-Layar-Windows-Portable
          path: ${{ env.APP_SOURCE }}/dist/Bagi-Layar/
