name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ambil source ke folder aman
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'bagi-layar-source.zip'
          $dst = Join-Path $env:RUNNER_TEMP 'bagi-layar-source'
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $src = Get-ChildItem $dst -Directory | Select-Object -First 1
          "APP_SOURCE=$($src.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Instal dependency build
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: python -m pip install -r "$env:APP_SOURCE\requirements.txt" pyinstaller

      - name: Validasi source dan UI
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location $env:APP_SOURCE
          python -m compileall -q app main.py
          python -c "from app.main_window import MainWindow; from app.widgets import MonitorPreview, WindowListWidget; print('Base UI imports OK')"
          python -c "from PySide6.QtWidgets import QApplication; from app.zone_overlay import ZoneOverlay; app=QApplication([]); overlay=ZoneOverlay(); overlay.close(); print('Zone overlay OK')"
          python -c "from app.multi_monitor import MultiMonitorMainWindow, MultiMonitorDragZoneController; p=MultiMonitorMainWindow._normalize_profile({'layout_count':4,'margin':9,'gap':7}); assert p['layout_count']==4 and p['margin']==9 and p['gap']==7; print('Multi-monitor profile OK')"
          python -c "from PySide6.QtWidgets import QApplication; from app.app_window import AppMainWindow; app=QApplication([]); win=AppMainWindow(); assert len(win._targets()) >= 1; assert win._monitor_index_for_key('__monitor_offline__', -1) == -1; assert win._connected_monitor_index_for_key('__monitor_offline__') == -1; assert callable(win.restore_missing_workspace_windows); win.close(); print('Hardened multi-monitor window OK')"
          python -c "from pathlib import Path; from app.paths import config_dir; from app.storage import Storage; cfg=config_dir(); store=Storage(); assert cfg.name.lower()=='config'; assert store.path.parent==cfg; print('Portable config path OK:', cfg)"
          python -c "from PySide6.QtWidgets import QApplication; from pathlib import Path; from app.app_window import AppMainWindow; from app.tray import TrayController; app=QApplication([]); win=AppMainWindow(); tray=TrayController(app,win,None,None); assert tray.open_action.text()=='Buka Bagi Layar'; assert tray.workspace_menu.title()=='Workspace Cepat'; assert tray.monitor_menu.title()=='Target Monitor Hotkey'; assert tray.auto_restore_action.text()=='Pulihkan workspace otomatis saat mulai'; assert tray.workspace_watch_action.text()=='Pantau workspace terus-menerus'; assert tray.startup_action.text()=='Mulai bersama Windows'; assert Path(tray.settings.fileName()).parent.name.lower()=='config'; tray.close(); win.close(); print('System tray controller OK')"
          python -c "from PySide6.QtWidgets import QApplication; from app.app_window import AppMainWindow; from app.auto_restore import StartupWorkspaceRestorer; from app.workspace_watch import WorkspaceWatchController; app=QApplication([]); win=AppMainWindow(); auto=StartupWorkspaceRestorer(win); watch=WorkspaceWatchController(win); assert auto.max_attempts==18 and auto.retry_interval_ms==5000; assert watch.interval_ms==4000; watch.close(); auto.close(); win.close(); print('Workspace recovery controllers OK')"
          python -c "from app.startup import startup_command; cmd=startup_command(); assert '--tray' in cmd; print('Portable auto-start command OK:', cmd)"
          python -c "from PySide6.QtWidgets import QApplication; from app.single_instance import SingleInstanceManager; app=QApplication([]); a=SingleInstanceManager(); assert a.acquire_or_notify(); b=SingleInstanceManager(); assert not b.acquire_or_notify(); [app.processEvents() for _ in range(5)]; assert a.consume_pending_show(); a.close(); print('Single-instance IPC OK')"

      - name: Tes engine layout
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Set-Location $env:APP_SOURCE
          python -m unittest discover -s tests -v

      - name: Build portable folder
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Set-Location $env:APP_SOURCE
          pyinstaller --noconfirm --clean --windowed --name "Bagi-Layar" main.py
          New-Item -ItemType Directory -Force -Path "dist\Bagi-Layar\config" | Out-Null
          @(
            "Folder konfigurasi portable Bagi Layar.",
            "workspace.json dan settings.ini akan dibuat otomatis di folder ini."
          ) | Set-Content -Path "dist\Bagi-Layar\config\README.txt" -Encoding UTF8

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Bagi-Layar-Windows-Portable
          path: ${{ env.APP_SOURCE }}/dist/Bagi-Layar/
