name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'sol/**'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ambil source ke folder aman
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = Join-Path $env:RUNNER_TEMP 'bagi-layar-source.zip'
          $dst = Join-Path $env:RUNNER_TEMP 'bagi-layar-source'
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $src = Get-ChildItem $dst -Directory | Select-Object -First 1
          if (-not $src) { throw 'Source hasil extract tidak ditemukan' }
          "APP_SOURCE=$($src.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Instal dependency build
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r "$env:APP_SOURCE\requirements.txt" pyinstaller

      - name: Validasi source dan UI produksi
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:APP_SOURCE
          python -m compileall -q app tools main.py
          python -c "from app.final_window import AppMainWindow, MultiMonitorDragZoneController; from app.reference_widgets import ToggleSwitch, ReferenceMonitorPreview; print('Final production UI imports OK')"
          python -c "from PySide6.QtWidgets import QApplication; from app.fonts import preferred_ui_font; app=QApplication([]); font=preferred_ui_font(10); assert font.family(); print('UI font terpilih:', font.family())"
          python -c "from PySide6.QtCore import Qt; from PySide6.QtWidgets import QApplication; from app.final_window import AppMainWindow; app=QApplication([]); win=AppMainWindow(); win.lock_timer.stop(); assert len(win._targets()) >= 1; assert win.minimumWidth() <= 1080; assert callable(win.restore_missing_workspace_windows); assert win.nav_group.exclusive(); assert bool(win.windowFlags() & Qt.FramelessWindowHint); assert len(win._chrome_controls)==3; win.close(); print('Hardened production window + integrated chrome OK')"
          python -c "from PySide6.QtWidgets import QApplication; from app.reference_widgets import ReferenceMonitorPreview; app=QApplication([]); p=ReferenceMonitorPreview(); assert not p._preview_image().isNull(); print('Preview wallpaper asset OK')"
          python -c "from PySide6.QtWidgets import QApplication; from app.zone_overlay import ZoneOverlay; app=QApplication([]); overlay=ZoneOverlay(); overlay.close(); print('Zone overlay OK')"
          python -c "from app.multi_monitor import MultiMonitorMainWindow; p=MultiMonitorMainWindow._normalize_profile({'layout_count':4,'margin':9,'gap':7}); assert p['layout_count']==4 and p['margin']==9 and p['gap']==7; print('Multi-monitor profile OK')"
          python -c "from pathlib import Path; from app.paths import config_dir; from app.storage import Storage; cfg=config_dir(); store=Storage(); assert cfg.name.lower()=='config'; assert store.path.parent==cfg; print('Portable config path OK:', cfg)"
          python -c "from PySide6.QtWidgets import QApplication; from pathlib import Path; from app.final_window import AppMainWindow; from app.tray import TrayController; app=QApplication([]); win=AppMainWindow(); win.lock_timer.stop(); tray=TrayController(app,win,None,None); assert tray.open_action.text()=='Buka Bagi Layar'; assert tray.workspace_menu.title()=='Workspace Cepat'; assert tray.monitor_menu.title()=='Target Monitor Hotkey'; assert tray.auto_restore_action.text()=='Pulihkan workspace otomatis saat mulai'; assert tray.workspace_watch_action.text()=='Pantau workspace terus-menerus'; assert tray.startup_action.text()=='Mulai bersama Windows'; assert Path(tray.settings.fileName()).parent.name.lower()=='config'; tray.close(); win.close(); print('System tray controller OK')"
          python -c "from PySide6.QtWidgets import QApplication; from app.final_window import AppMainWindow; from app.auto_restore import StartupWorkspaceRestorer; from app.workspace_watch import WorkspaceWatchController; app=QApplication([]); win=AppMainWindow(); win.lock_timer.stop(); auto=StartupWorkspaceRestorer(win); watch=WorkspaceWatchController(win); assert auto.max_attempts==18 and auto.retry_interval_ms==5000; assert watch.interval_ms==4000; watch.close(); auto.close(); win.close(); print('Workspace recovery controllers OK')"
          python -c "from app.startup import startup_command; cmd=startup_command(); assert '--tray' in cmd; print('Portable auto-start command OK:', cmd)"
          python -c "from PySide6.QtWidgets import QApplication; from app.single_instance import SingleInstanceManager; app=QApplication([]); a=SingleInstanceManager(); assert a.acquire_or_notify(); b=SingleInstanceManager(); assert not b.acquire_or_notify(); [app.processEvents() for _ in range(5)]; assert a.consume_pending_show(); a.close(); print('Single-instance IPC OK')"

      - name: Tes engine dan regression Astra B01-B11
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:APP_SOURCE
          python -m unittest discover -s tests -v

      - name: Render screenshot fixture UI di platform Windows native
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          Set-Location $env:APP_SOURCE
          python tools/render_ui_snapshots.py
          Get-ChildItem artifacts\ui

      - name: Upload screenshot UI
        uses: actions/upload-artifact@v4
        with:
          name: Bagi-Layar-UI-Snapshots
          path: ${{ env.APP_SOURCE }}/artifacts/ui/

      - name: Build dan smoke-test portable folder
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location $env:APP_SOURCE
          pyinstaller --noconfirm --clean --windowed --name "Bagi-Layar" --add-data "app/assets/preview_wallpaper.png;app/assets" main.py
          New-Item -ItemType Directory -Force -Path "dist\Bagi-Layar\config" | Out-Null
          @(
            "Folder konfigurasi portable Bagi Layar.",
            "workspace.json dan settings.ini akan dibuat otomatis di folder ini."
          ) | Set-Content -Path "dist\Bagi-Layar\config\README.txt" -Encoding UTF8

          # Smoke test EXE hasil build dari lokasi yang sudah dipindah dan memakai
          # path berspasi/non-ASCII. Ini menguji start-up paket portable, bukan
          # sekadar source Python.
          $smokeDir = Join-Path $env:RUNNER_TEMP 'Bagi Layar Uji_日本'
          if (Test-Path $smokeDir) { Remove-Item $smokeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Copy-Item -Path "dist\Bagi-Layar\*" -Destination $smokeDir -Recurse -Force
          $exe = Join-Path $smokeDir 'Bagi-Layar.exe'
          if (-not (Test-Path $exe)) { throw "EXE portable tidak ditemukan di lokasi smoke test" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath $exe -ArgumentList '--tray' -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "EXE portable keluar saat smoke test dengan kode $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()
          Write-Host "Portable EXE smoke test OK dari: $smokeDir"

          $zip = "dist\Bagi-Layar-Windows-Portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\Bagi-Layar\*" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "ZIP portable tidak terbentuk" }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Bagi-Layar-Windows-Portable
          path: ${{ env.APP_SOURCE }}/dist/Bagi-Layar-Windows-Portable.zip
